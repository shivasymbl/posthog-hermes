name: posthog
version: "0.1.0"
description: "PostHog LLM Analytics for Hermes — emits $ai_generation, $ai_span, $ai_trace events. Install: git clone https://github.com/shivasymbl/posthog-hermes ~/.hermes/plugins/posthog && hermes plugins enable posthog"
author: "@shivasymbl"
requires_env:
  - POSTHOG_API_KEY
provides_hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_end
