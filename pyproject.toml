[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "posthog-hermes"
version = "0.1.0"
description = "PostHog LLM Analytics plugin for Hermes Agent"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
runtime = ["posthog>=7.0,<8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyright>=1.1",
    "ruff>=0.4",
    "posthog>=7.0,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
